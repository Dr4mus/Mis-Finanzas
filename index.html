<script>try{var d=document.documentElement;if(localStorage.getItem('fin_pin'))d.classList.add('locked');d.setAttribute('data-palette',localStorage.getItem('fin_palette')||'original');var t=localStorage.getItem('fin_theme');if(t=='claro')d.setAttribute('data-theme','light');else if(t=='dark')d.setAttribute('data-theme','dark');var it=localStorage.getItem('fin_icons');if(/^(suave|relleno|duotono|material)$/.test(it)){d.classList.add('ic-'+it);document.write('<link rel="stylesheet" data-opt="1" id="ic-css-'+it+'" href="css/iconos-'+it+'.css?v=10.2.0">')}if(localStorage.getItem('fin_icolor')=='degradado')d.classList.add('ic-grad');var mv=localStorage.getItem('fin_imov')||(localStorage.getItem('fin_imotion')=='0'?'off':'live');if(mv!='off')d.classList.add('ic-anim');if(mv=='live')d.classList.add('ic-live')}catch(e){}</script>
<script>
/* Protección de arranque: si algún archivo no carga o falla, muestra qué pasó y un botón para reparar
   (en vez de dejar la pantalla en blanco). */
window.__V = {}; window.__ERRS = [];
window.addEventListener('error', function (e) {
  var t = e.target;
  if (t && t.getAttribute && t.getAttribute('data-opt')) return; // tema de íconos opcional: si falla, se ven los de siempre
  if (t && (t.tagName == 'SCRIPT' || t.tagName == 'LINK') && (t.src || t.href)) window.__ERRS.push('No se pudo cargar: ' + (t.src || t.href).split('/').slice(-2).join('/').split('?')[0]);
  else if (e.message) window.__ERRS.push(e.message + (e.filename ? ' (' + e.filename.split('/').pop().split('?')[0] + ':' + e.lineno + ')' : ''));
}, true);
window.__repair = function () {
  var go = function () { location.replace(location.pathname + '?r=' + Date.now()); };
  try {
    Promise.all([
      navigator.serviceWorker ? navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }) : 0,
      window.caches ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }) : 0
    ]).then(go, go);
  } catch (e) { go(); }
};
window.__showFail = function (title, items) {
  if (document.getElementById('bootfail')) return;
  var esc = function (s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var d = document.createElement('div'); d.id = 'bootfail';
  d.setAttribute('style', 'position:fixed;inset:0;z-index:200;background:#f6f4fa;color:#231d2e;font:15px/1.5 system-ui,-apple-system,sans-serif;padding:24px;overflow:auto');
  d.innerHTML = '<div style="max-width:520px;margin:30px auto"><h2 style="margin:0 0 8px">' + esc(title) + '</h2>' +
    '<p>Casi siempre es porque el teléfono guardó archivos de la versión anterior, o porque algún archivo no se subió completo a GitHub. Tus datos están a salvo.</p>' +
    (items && items.length ? '<ul style="background:#fff;border:1px solid #e6e1ee;border-radius:12px;padding:12px 12px 12px 30px;font-size:13px">' + items.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul>' : '') +
    '<button onclick="__repair()" style="width:100%;min-height:48px;border:0;border-radius:12px;background:#5b3fd6;color:#fff;font:700 16px system-ui">Reparar y recargar</button>' +
    '<p style="font-size:13px;color:#6f6780">Si después de reparar sigue saliendo este mensaje, toma una captura y envíala: dice exactamente qué archivo revisar.</p></div>';
  document.body.appendChild(d);
};
window.addEventListener('load', function () { setTimeout(function () { if (!window.__booted) window.__showFail('La app no pudo arrancar', window.__ERRS.length ? window.__ERRS : ['Error desconocido']); }, 400); });
</script>
